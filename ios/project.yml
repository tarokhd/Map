name: IranNavigator
options:
  bundleIdPrefix: com.irannavigator
  deploymentTarget:
    iOS: "16.0"

targets:
  IranNavigator:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: build/World
        type: folder
        buildPhase: resources
    info:
      path: build/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Iran Navigator
        NSLocationWhenInUseUsageDescription: "برای نمایش موقعیت فعلی و ناوبری، به موقعیت مکانی نیاز داریم."
        UIUserInterfaceStyle: Automatic
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irannavigator.ios
        PRODUCT_NAME: IranNavigator
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: Iran Navigator
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "برای نمایش موقعیت فعلی شما روی نقشه و ارائه راهنمای مسیریابی، به موقعیت مکانی نیاز داریم."
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic

  IranNavigatorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit
    dependencies:
      - target: IranNavigator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irannavigator.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

  IranNavigatorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: IranNavigator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irannavigator.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: IranNavigator
        SWIFT_VERSION: "5.0"

schemes:
  IranNavigator:
    build:
      targets:
        IranNavigator: all
        IranNavigatorTests: [test]
        IranNavigatorUITests: [test]
    test:
      config: Debug
      targets:
        - IranNavigatorTests
        - IranNavigatorUITests
