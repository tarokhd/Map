name: Build Iran Navigator Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "shared/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Verify Android project
        working-directory: android
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/java/com/irannavigator/demo/MainActivity.kt
          test -f app/src/main/java/com/irannavigator/demo/RoutingEngine.kt
          test -f app/src/main/java/com/irannavigator/demo/PersianVoice.kt

      - name: Run Android unit tests
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IranNavigator-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
