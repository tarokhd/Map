name: Deploy Iran Navigator Web Preview

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "shared/**"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vendor MapLibre assets for same-origin hosting
        run: |
          mkdir -p "$RUNNER_TEMP/maplibre-package" web/vendor
          npm pack maplibre-gl@6.17.0 --pack-destination "$RUNNER_TEMP/maplibre-package"
          tar -xzf "$RUNNER_TEMP/maplibre-package/maplibre-gl-6.17.0.tgz" -C "$RUNNER_TEMP/maplibre-package"
          cp "$RUNNER_TEMP/maplibre-package/package/dist/maplibre-gl.mjs" web/vendor/
          cp "$RUNNER_TEMP/maplibre-package/package/dist/maplibre-gl-worker.mjs" web/vendor/
          cp "$RUNNER_TEMP/maplibre-package/package/dist/maplibre-gl.css" web/vendor/
          cp "$RUNNER_TEMP/maplibre-package/package/LICENSE.txt" web/vendor/LICENSE.txt
          test -s web/vendor/maplibre-gl.mjs
          test -s web/vendor/maplibre-gl-worker.mjs
          test -s web/vendor/maplibre-gl.css

      - name: Validate web entry point and JavaScript
        run: |
          test -s web/index.html
          test -s web/vendor/maplibre-gl.mjs
          test -s web/vendor/maplibre-gl-worker.mjs
          test -s web/vendor/maplibre-gl.css
          grep -q './vendor/maplibre-gl.mjs' web/index.html
          grep -q './vendor/maplibre-gl.css' web/index.html
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('web/index.html', 'utf8');
          const marker = '<script type="module">';
          const start = html.indexOf(marker);
          const end = html.indexOf('</script>', start + marker.length);
          if (start < 0 || end < 0) throw new Error('MapLibre ES module application script not found');
          fs.writeFileSync('/tmp/iran-navigator-web.js', html.slice(start + marker.length, end));
          NODE
          node --check /tmp/iran-navigator-web.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
