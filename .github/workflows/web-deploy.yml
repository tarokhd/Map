name: Deploy Iran Navigator Web Preview

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "shared/**"
      - "scripts/web_map_smoke.cjs"
      - ".github/workflows/web-deploy.yml"
      - ".github/workflows/web-browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/web-browser-smoke.yml
    permissions:
      contents: read
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
