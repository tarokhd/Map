name: Build Iran Navigator iOS Simulator App

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "shared/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - "shared/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancel-stale-ios-runs:
    name: Cancel superseded iOS builds
    runs-on: ubuntu-latest
    steps:
      - name: Cancel older queued or stuck iOS workflow runs
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ios-build.yml --limit 100 --json databaseId,status \
            --jq ".[] | select(.databaseId != $GITHUB_RUN_ID and (.status == \"in_progress\" or .status == \"queued\")) | .databaseId" \
            | while read -r run_id; do
                [ -z "$run_id" ] || gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
              done

  build-ios-simulator:
    needs: cancel-stale-ios-runs
    name: Test and build iOS Simulator app
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/IranNavigator.xcodeproj \
            -scheme IranNavigator

      - name: Run iOS unit and UI tests
        run: |
          xcodebuild \
            -project ios/IranNavigator.xcodeproj \
            -scheme IranNavigator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -derivedDataPath "$RUNNER_TEMP/IranNavigatorTestDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/IranNavigatorTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build app for iOS Simulator
        run: |
          xcodebuild \
            -project ios/IranNavigator.xcodeproj \
            -scheme IranNavigator \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/IranNavigatorDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          APP_PATH="$RUNNER_TEMP/IranNavigatorDerivedData/Build/Products/Debug-iphonesimulator/IranNavigator.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$GITHUB_WORKSPACE/IranNavigator-iOS-Simulator.zip"

      - name: Upload simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: IranNavigator-iOS-Simulator-App
          path: IranNavigator-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
