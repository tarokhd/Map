name: Build Iran Navigator iOS Simulator App

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "shared/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - "shared/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-simulator:
    name: Test and build iOS Simulator app
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/IranNavigator.xcodeproj \
            -scheme IranNavigator

      - name: Prepare iPhone simulator and simulated GPS
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator was found."
            exit 1
          fi
          echo "IOS_SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl privacy "$SIMULATOR_ID" grant location com.irannavigator.ios
          xcrun simctl location "$SIMULATOR_ID" set 35.7006,51.4050

      - name: Run iOS unit and UI tests
        run: |
          xcodebuild \
            -project ios/IranNavigator.xcodeproj \
            -scheme IranNavigator \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/IranNavigatorTestDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/IranNavigatorTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build app for iOS Simulator
        run: |
          xcodebuild \
            -project ios/IranNavigator.xcodeproj \
            -scheme IranNavigator \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/IranNavigatorDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          APP_PATH="$RUNNER_TEMP/IranNavigatorDerivedData/Build/Products/Debug-iphonesimulator/IranNavigator.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$GITHUB_WORKSPACE/IranNavigator-iOS-Simulator.zip"

      - name: Upload simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: IranNavigator-iOS-Simulator-App
          path: IranNavigator-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
