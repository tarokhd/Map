openapi: 3.1.0
info:
  title: Iran Navigator Shared API
  version: 0.1.0
  description: >-
    Contract-first API shared by Iran Navigator Android and Web.
    User-data endpoints are planned and are not implemented by the current backend scaffold yet.
servers:
  - url: https://api.example.invalid
    description: Placeholder; replace after backend deployment.
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      summary: Liveness check
      responses:
        "200":
          description: API process is alive
  /readyz:
    get:
      security: []
      summary: Database readiness check
      responses:
        "200":
          description: Database is reachable
        "503":
          description: Database is unavailable
  /api/v1/routes:
    post:
      security: []
      summary: Calculate a route using the selected provider adapter
      description: >-
        The backend keeps provider credentials server-side. For live traffic,
        car and motorcycle routes may use the licensed Neshan Direction API.
        Walking currently uses Valhalla. A non-traffic fallback must be
        explicitly identified and must never be labeled traffic-aware.
      x-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteRequest"
      responses:
        "200":
          description: One or more normalized route options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteResponse"
        "400":
          description: Invalid coordinates or unsupported request options
        "429":
          description: Route request rate limit exceeded
        "502":
          description: Routing provider returned an invalid response
        "503":
          description: Requested routing provider is unavailable or not configured
  /api/v1/me/places:
    get:
      summary: List the authenticated user's saved places
      x-implementation-status: planned
      responses:
        "200":
          description: Saved places
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedPlace"
        "401":
          description: Authentication required
    post:
      summary: Save a place for the authenticated user
      x-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSavedPlace"
      responses:
        "201":
          description: Place saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedPlace"
        "401":
          description: Authentication required
  /api/v1/me/places/{placeId}:
    delete:
      summary: Delete one of the authenticated user's saved places
      x-implementation-status: planned
      parameters:
        - name: placeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Place deleted
        "401":
          description: Authentication required
        "404":
          description: Place not found
  /api/v1/me/routes:
    get:
      summary: List the authenticated user's route history
      x-implementation-status: planned
      responses:
        "200":
          description: Route history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RouteHistory"
        "401":
          description: Authentication required
    post:
      summary: Save a completed route
      x-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRouteHistory"
      responses:
        "201":
          description: Route saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteHistory"
        "401":
          description: Authentication required
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Coordinates:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    RouteRequest:
      type: object
      required: [origin, destination, travel_mode]
      properties:
        origin:
          $ref: "#/components/schemas/Coordinates"
        destination:
          $ref: "#/components/schemas/Coordinates"
        waypoints:
          type: array
          items:
            $ref: "#/components/schemas/Coordinates"
        travel_mode:
          type: string
          enum: [car, motorcycle, walking]
        traffic_preference:
          type: string
          enum: [live, none]
          default: live
        alternatives:
          type: boolean
          default: true
        allow_non_traffic_fallback:
          type: boolean
          default: false
        avoid_traffic_zone:
          type: boolean
          default: false
        avoid_odd_even_zone:
          type: boolean
          default: false
        bearing:
          type: integer
          minimum: 0
          maximum: 360
    RouteResponse:
      type: object
      required: [options, requested_traffic_preference, generated_at]
      properties:
        options:
          type: array
          items:
            $ref: "#/components/schemas/RouteOption"
        requested_traffic_preference:
          type: string
          enum: [live, none]
        generated_at:
          type: string
          format: date-time
    RouteOption:
      type: object
      required: [id, provider, traffic_aware, distance_m, duration_s, overview_geometry, legs]
      properties:
        id:
          type: string
        provider:
          type: string
          enum: [neshan, valhalla]
        traffic_aware:
          type: boolean
        fallback_used:
          type: boolean
          default: false
        fallback_reason:
          type: [string, "null"]
        distance_m:
          type: number
          minimum: 0
        duration_s:
          type: number
          minimum: 0
        overview_geometry:
          $ref: "#/components/schemas/EncodedGeometry"
        legs:
          type: array
          items:
            $ref: "#/components/schemas/RouteLeg"
    RouteLeg:
      type: object
      required: [distance_m, duration_s, steps]
      properties:
        summary:
          type: string
        distance_m:
          type: number
          minimum: 0
        duration_s:
          type: number
          minimum: 0
        steps:
          type: array
          items:
            $ref: "#/components/schemas/RouteManeuver"
    RouteManeuver:
      type: object
      required: [instruction, distance_m, duration_s]
      properties:
        instruction:
          type: string
        street_name:
          type: string
        type:
          type: string
        modifier:
          type: string
        end_shape_index:
          type: [integer, "null"]
          minimum: 0
        distance_m:
          type: number
          minimum: 0
        duration_s:
          type: number
          minimum: 0
        geometry:
          $ref: "#/components/schemas/EncodedGeometry"
    EncodedGeometry:
      type: object
      required: [encoding, value]
      properties:
        encoding:
          type: string
          enum: [encoded-polyline, polyline6]
        precision:
          type: [integer, "null"]
          minimum: 0
          maximum: 8
        value:
          type: string
    SavedPlace:
      type: object
      required: [id, title, location, created_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        note:
          type: [string, "null"]
        location:
          $ref: "#/components/schemas/Coordinates"
        created_at:
          type: string
          format: date-time
    CreateSavedPlace:
      type: object
      required: [title, location]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        note:
          type: [string, "null"]
        location:
          $ref: "#/components/schemas/Coordinates"
    RouteHistory:
      type: object
      required: [id, origin, destination, travel_mode, created_at]
      properties:
        id:
          type: string
          format: uuid
        origin:
          $ref: "#/components/schemas/Coordinates"
        destination:
          $ref: "#/components/schemas/Coordinates"
        travel_mode:
          type: string
          enum: [car, motorcycle, walking]
        distance_m:
          type: [number, "null"]
        duration_s:
          type: [number, "null"]
        created_at:
          type: string
          format: date-time
    CreateRouteHistory:
      type: object
      required: [origin, destination, travel_mode]
      properties:
        origin:
          $ref: "#/components/schemas/Coordinates"
        destination:
          $ref: "#/components/schemas/Coordinates"
        travel_mode:
          type: string
          enum: [car, motorcycle, walking]
        distance_m:
          type: [number, "null"]
        duration_s:
          type: [number, "null"]
